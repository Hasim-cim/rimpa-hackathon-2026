[project]
name = "record-check"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.15.0",
    "fastapi>=0.143.3",
    "fpdf2>=2.8",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

# The Vercel API installs with --no-dev, so the console and the test runner stay out of the function bundle
# (Streamlit pulls in pandas, pyarrow and numpy, which overflowed the function's disk at cold start).
# A plain `uv sync` installs this group too, so local runs are unchanged.
[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "streamlit>=1.66.0",
]
